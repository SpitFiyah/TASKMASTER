name: Build and deploy BEASTosTASKMASTER to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: BEASTosTASKMASTER
  NODE_VERSION: 20.x

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: dist

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_51F600DA2D4F44F5AE105BC01227F88D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F8D7E6BB1CE04E9A89242D11C345CF4C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_34F6CB3F90C74DA8BFFAEDBA533E2DA8 }}

      - name: Deploy static site
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: dist
          type: static
          clean: true
